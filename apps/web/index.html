<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__PROJECT_NAME__</title>
  <meta name="description" content="__PROJECT_DESCRIPTION__">
  <meta name="color-scheme" content="dark light">
  <meta property="og:title" content="__PROJECT_NAME__">
  <meta property="og:description" content="__PROJECT_DESCRIPTION__">
  <!-- Add assets/icon.png (256 px) and assets/favicon.png (64 px) copied from the app, then uncomment:
  <meta property="og:image" content="assets/icon.png">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="title">
      <h1 id="title">__PROJECT_NAME__</h1>
      <p class="lede">__PROJECT_DESCRIPTION__</p>
      <div class="downloads" aria-label="Download">
        <!-- Add the store URL as href once each app is live. No href shows "Coming soon". -->
        <a id="download-ios" class="store">
          <span class="store-name">App Store</span>
          <span class="store-status">Coming soon</span>
        </a>
        <a id="download-android" class="store">
          <span class="store-name">Google Play</span>
          <span class="store-status">Coming soon</span>
        </a>
      </div>
    </section>

    <section class="features" aria-labelledby="features-title">
      <h2 id="features-title">Features</h2>
      <!-- Keep these true for every app that's out (docs/feature-parity.md). -->
      <ul>
        <li>Feature one.</li>
        <li>Feature two.</li>
        <li>Feature three.</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>© __YEAR__ <a href="__OWNER_URL__">__OWNER_NAME__</a></p>
  </footer>
</body>
</html>
